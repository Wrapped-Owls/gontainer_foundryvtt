name: Build and publish OCI image

on:
  push:
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - main

concurrency:
  group: build-image-${{ github.ref_name }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: wrapped-owls/gontainer_foundryvtt

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          target: runtime
          load: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:verify
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify the pinned runtimes
        run: |
          image="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:verify"
          want_bun=$(sed -n 's/.*version = "\(.*\)".*/\1/p' nix/overlay.nix | head -1)
          got_bun=$(docker run --rm --entrypoint /bin/bun "$image" --version)
          if [ "$got_bun" != "$want_bun" ]; then
            echo "bun is $got_bun, but nix/overlay.nix pins $want_bun" >&2
            exit 1
          fi
          docker run --rm --entrypoint /bin/node22 "$image" --version | grep -q '^v22\.'
          docker run --rm --entrypoint /bin/node24 "$image" --version | grep -q '^v24\.'
          echo "bun $got_bun, node22 and node24 all present"

      - name: Push image
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          target: runtime
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
